#################################
#            Backend             #
#################################

backend = "glx";
use-damage = true;
vsync = true;


#################################
#            Shadows             #
#################################

shadow = true;
shadow-radius = 14;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.5;

shadow-exclude = [
  "class_g = 'i3-frame'",
  "class_g = 'polybar'",
  "class_g = 'dunst'",
  "class_g = 'rofi'",
  "class_g = 'eww'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'notification'",
  "name *= 'picom'",
  "name *= 'Chromium'",
  "name *= 'Chrome'",
  "name *= 'Firefox'"
];


#################################
#             Fading             #
#################################

fading = true;
fade-in-step = 0.045;
fade-out-step = 0.045;


#################################
#        Transparency            #
#################################

frame-opacity = 0.7;
inactive-opacity = 0.95;
active-opacity = 1.0;
inactive-opacity-override = false;


#################################
#          Detection             #
#################################

detect-client-opacity = true;
detect-transient = true;
detect-rounded-corners = true;


#################################
#             Blur               #
#################################

# Blur DESATIVADO propositalmente
# (mantém performance e evita configs inúteis)
blur-method = "none";


#################################
#          Window Types          #
#################################

wintypes:
{
  tooltip = { fade = false; shadow = true; opacity = 0.75; };
  dock    = { shadow = false; fade = false; };
  dnd     = { shadow = false; };
  popup_menu = { shadow = false; };
  dropdown_menu = { shadow = false; };
  utility = { shadow = false; };
  notification = { shadow = false; };
};


#################################
#        Opacity Rules           #
#################################

opacity-rule = [
  "80:class_g = 'copyq'",
  "90:name = 'alttab'"
];
